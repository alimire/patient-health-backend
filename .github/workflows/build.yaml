name: Build and Push Backend

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

env:
  IMAGE_NAME: patient-health-backend
  REGISTRY_HOSTNAME: us.icr.io
  REGISTRY_NAMESPACE: ${{ vars.IBM_REGISTRY_NAMESPACE }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Log in to IBM Cloud Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY_HOSTNAME }}
        username: iamapikey
        password: ${{ secrets.IBM_CLOUD_API_KEY }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ env.REGISTRY_HOSTNAME }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest