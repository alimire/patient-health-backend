apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-health-backend
  namespace: patient-health
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patient-health-backend
  template:
    metadata:
      labels:
        app: patient-health-backend
    spec:
      imagePullSecrets:
      - name: ibm-cr-secret
      containers:
      - name: backend
        image: us.icr.io/patient-health-dev/patient-health-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        # Inject Cloudant Credentials from the Secret
        - name: CLOUDANT_URL
          valueFrom:
            secretKeyRef:
              name: cloudant-secrets
              key: url
        - name: CLOUDANT_APIKEY
          valueFrom:
            secretKeyRef:
              name: cloudant-secrets
              key: username
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: patient-health-backend
  namespace: patient-health
spec:
  selector:
    app: patient-health-backend
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP